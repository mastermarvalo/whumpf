# Whumpf web: nginx serving the Expo web app's static export (whumpf-ios,
# `npx expo export -p web`) from /data/web/current, which `make web-build`
# and `make web-rollback` switch between releases. docs/runbook.md §17.
#
# Mounted as /etc/nginx/conf.d/default.conf (inside the image's http block),
# so it replaces the image's default server on :80.

# Paths only: query strings can carry Strava's code and state or email-link
# codes, which the privacy policy says we don't log (§16). No referer either.
log_format web_noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    access_log /dev/stdout web_noquery;
    server_tokens off;
    # Redirects (e.g. a directory without its slash) stay relative, so they
    # work behind Nginx Proxy Manager and Cloudflare.
    absolute_redirect off;

    root /data/web/current/dist;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # HTML (and everything else not matched below) is revalidated every time,
    # so a deploy or rollback shows at the next page load. add_header is not
    # inherited by locations that set their own, so those repeat nosniff.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;

    # The app's not-found page, with a 404 status.
    error_page 404 /+not-found.html;

    # Bundles and images have a content hash in their names: cache forever.
    # A missing one is a plain 404, never the not-found HTML (which a browser
    # or Cloudflare would otherwise keep as a script for a year).
    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri @missing_asset;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri @missing_asset;
    }
    location @missing_asset {
        add_header Cache-Control "no-store" always;
        types { }
        default_type text/plain;
        return 404 "not found\n";
    }

    location = /favicon.ico {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Kill switch for the old Vite site's service worker (vite-plugin-pwa,
    # frontend/vite.config.ts), registered at /sw.js with scope / by
    # /registerSW.js. A browser that visited the old site checks /sw.js for
    # an update on its next visit, gets this byte-different worker, which
    # takes over (skipWaiting), unregisters itself, deletes the old worker's
    # caches (Workbox precache and the tile caches named in vite.config.ts)
    # and reloads open tabs, which then load the app from the network.
    # Never cached, so the check always reaches us. No "$" in the script:
    # nginx would read it as a variable.
    location = /sw.js {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        types { }
        default_type application/javascript;
        return 200 "// Removes the old whumpf.co service worker.
var OLD_CACHES = ['whumpf-tiles', 'titiler-tiles', 'esri-basemaps', 'openfreemap',
  'carto-basemaps', 'opensnowmap', 'nws-wms'];
self.addEventListener('install', function () { self.skipWaiting(); });
self.addEventListener('activate', function (event) {
  event.waitUntil((async function () {
    await self.registration.unregister();
    var names = await caches.keys();
    await Promise.all(names.filter(function (n) {
      return n.indexOf('workbox-') === 0 || OLD_CACHES.indexOf(n) !== -1;
    }).map(function (n) { return caches.delete(n); }));
    var clients = await self.clients.matchAll({ type: 'window' });
    clients.forEach(function (c) { c.navigate(c.url); });
  })());
});
";
    }
    # An old page still running (or an old index.html from somewhere) would
    # load this and register /sw.js again; instead it unregisters, so the
    # kill switch above can't loop.
    location = /registerSW.js {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        types { }
        default_type application/javascript;
        return 200 "if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function (rs) {
    rs.forEach(function (r) { r.unregister(); });
  });
}
";
    }

    # Expo Router's development route list; not for the public site.
    location ~ "^/_sitemap(\.html)?$" {
        return 404;
    }

    # Dynamic routes (/trip/42 -> /trip/[id].html), generated from the
    # release by scripts/web_routes.py. A glob, so nginx still starts before
    # the first release exists.
    include /data/web/current/nginx-routes*.conf;

    # /sign-in -> sign-in.html, /offline -> offline/index.html.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}
